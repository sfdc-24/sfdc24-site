name: ops-delivery-python-test

on:
  pull_request:
    paths:
      - "tools/ops_delivery*.py"
      - "tools/ops_pr_board.py"
      - "tests/test_ops_delivery*.py"
      - "tests/test_ops_pr_board.py"
      - "assets/ops-pr-board.js"
      - "ops/index.html"
      - "data/pr-board-public.json"
      - "data/ops-delivery*.json"
      - ".github/workflows/ops-delivery*.yml"
  push:
    branches: [main]
    paths:
      - "tools/ops_delivery*.py"
      - "tools/ops_pr_board.py"
      - "tests/test_ops_delivery*.py"
      - "tests/test_ops_pr_board.py"
      - "assets/ops-pr-board.js"
      - "ops/index.html"
      - "data/pr-board-public.json"
      - "data/ops-delivery*.json"
      - ".github/workflows/ops-delivery*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_ops_delivery*.py' -v
      - run: python -m unittest discover -s tests -p 'test_ops_pr_board.py' -v
