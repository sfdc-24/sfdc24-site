name: honesty-dom-test

# Honesty guard retired 2026-09-26 by owner; do not re-add.
# The capability-claim steps (honesty.spec.cjs, honesty_negative_control.cjs,
# tests/capabilities.json) are deleted. This job remains only because it also
# runs unrelated browser specs. Do not put a capability-claim or honesty-dom
# step back in this file.
#
# pull_request is always-on. push:to main keeps path filters.
# Job name kept so an existing check context does not get renamed by accident.
# Ruleset 23679990 does not require this job.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "assets/**"
      - "tests/**"
      - "playwright.config.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/honesty-dom-test.yml"

permissions:
  contents: read

jobs:
  dom:
    name: honesty-dom-test / dom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # `npm ci` and not `npm install`: it installs exactly the committed
      # lockfile and fails if the manifest and lock have drifted. Both are now
      # tracked, which is the whole point of this workflow existing.
      - name: Install from the lockfile
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public capability FAQs stay local in the rendered homepage
        run: npx playwright test tests/public_faq.spec.cjs --reporter=line
      - name: Header date, contrast, and truthful release status
        run: npx playwright test tests/header-release.spec.cjs --reporter=line

      - name: Homepage microphone pause and cancellation in the browser
        run: npx playwright test tests/homepage_microphone.spec.cjs --reporter=line

      - name: Homepage voice conversation (realtime call, talk lane, barge-in)
        run: npx playwright test tests/homepage_voice_conversation.spec.cjs --reporter=line

      - name: Homepage live canvas (builder events, scene engine, safety)
        run: npx playwright test tests/homepage_prototype_canvas.spec.cjs --reporter=line

      - name: History responsive width and preserved timeline content
        run: npx playwright test tests/history_layout.spec.cjs --reporter=line

      - name: Every published page names the site icon
        run: npx playwright test tests/page-icons.spec.cjs --reporter=line

      - name: Readable controls and keyboard-reachable scroll regions
        run: npx playwright test tests/readable-controls.spec.cjs --reporter=line

      - name: No published page scrolls sideways on a phone
        run: npx playwright test tests/phone-no-sideways-scroll.spec.cjs --reporter=line

      - name: The footer a visitor sees, rendered on every page
        run: npx playwright test tests/footer-nav.spec.cjs --reporter=line

      - name: The review quiz's answers are where it says they are
        run: npx playwright test tests/review-quiz-answers.spec.cjs --reporter=line
