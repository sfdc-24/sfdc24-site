name: ops-gantt-test

on:
  pull_request:
    paths:
      - "ops/index.html"
      - "assets/ops-gantt.*"
      - "data/ops-delivery.json"
      - "tests/ops_gantt.cjs"
      - ".github/workflows/ops-gantt-test.yml"
  push:
    branches: [main]
    paths:
      - "ops/index.html"
      - "assets/ops-gantt.*"
      - "data/ops-delivery.json"
      - "tests/ops_gantt.cjs"
      - ".github/workflows/ops-gantt-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/ops_gantt.cjs
