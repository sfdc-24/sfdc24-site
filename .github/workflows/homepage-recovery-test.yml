name: homepage-recovery-test

# 2026-09-18 overnight: pull_request always-on so ruleset 23679990 can require
# homepage-recovery-test / test on every PR. push:to main keeps path filters.
# Job name set to match the required check context.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/homepage_recovery.cjs
      - .github/workflows/homepage-recovery-test.yml

permissions:
  contents: read

jobs:
  test:
    name: homepage-recovery-test / test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/homepage_recovery.cjs
      - run: node --test tests/ask_bar_ux.cjs
