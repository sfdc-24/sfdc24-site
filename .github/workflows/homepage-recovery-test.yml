name: homepage-recovery-test

# 2026-09-18 overnight: pull_request always-on so ruleset 23679990 can require
# homepage-recovery-test / test on every PR. push:to main keeps path filters.
# Job name set to match the required check context.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/homepage_recovery.cjs
      - tests/ask_bar_ux.cjs
      - tests/decision_questions_reach_an_agent.cjs
      - tests/cards_match_the_question.cjs
      - tests/estimator_shapes.cjs
      - assets/local-first-boot.js
      - assets/overnight-polish-boot.js
      - assets/triage.py
      - assets/triage.js
      - tests/grounded_object_model.cjs
      - tests/served_voice_page.cjs
      - voice/index.html
      - .github/workflows/homepage-recovery-test.yml

permissions:
  contents: read

jobs:
  test:
    name: homepage-recovery-test / test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/homepage_recovery.cjs
      - run: node --test tests/ask_bar_ux.cjs
      - run: node --test tests/decision_questions_reach_an_agent.cjs
      - run: node --test tests/cards_match_the_question.cjs
      - run: node --test tests/grounded_object_model.cjs
      - run: node --test tests/served_voice_page.cjs
      - run: node tests/estimator_shapes.cjs
      # assets/triage.js is GENERATED. Editing it by hand, or editing
      # assets/triage.py and forgetting to regenerate, ships a page whose
      # behaviour no longer matches its source - and every suite above reads
      # the generated file, so it would stay green.
      - run: python3 assets/triage.py
      # -I skips the hunk that only carries the build stamp.
      - run: git diff --exit-code -I '[Bb]uilt.*[0-9]{4}-[0-9]{2}-[0-9]{2}' assets/triage.js
