name: xp-public-snapshot

on:
  pull_request:
    paths:
      - "data/xp-live.json"
      - "tests/public_xp_snapshot.cjs"
      - ".github/workflows/xp-public-snapshot.yml"
  push:
    branches: [main]
    paths:
      - "data/xp-live.json"
      - "tests/public_xp_snapshot.cjs"
      - ".github/workflows/xp-public-snapshot.yml"

permissions:
  contents: read

jobs:
  test:
    name: xp-public-snapshot / test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/public_xp_snapshot.cjs
