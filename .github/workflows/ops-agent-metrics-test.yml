name: ops-agent-metrics-test

on:
  pull_request:
    paths:
      - "ops/index.html"
      - "assets/ops-agent-metrics.js"
      - "assets/ops-agent-metrics.css"
      - "data/ops-agent-metrics.json"
      - "data/ops-agent-metrics-daily.json"
      - "tools/ops_agent_metrics.py"
      - "tests/ops_agent_metrics.cjs"
      - "tests/test_ops_agent_metrics.py"
      - ".github/workflows/ops-agent-metrics-test.yml"
  push:
    branches: [main]
    paths:
      - "ops/index.html"
      - "assets/ops-agent-metrics.js"
      - "assets/ops-agent-metrics.css"
      - "data/ops-agent-metrics.json"
      - "data/ops-agent-metrics-daily.json"
      - "tools/ops_agent_metrics.py"
      - "tests/ops_agent_metrics.cjs"
      - "tests/test_ops_agent_metrics.py"
      - ".github/workflows/ops-agent-metrics-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: The page, the renderer and the committed snapshot
        run: node --test tests/ops_agent_metrics.cjs
      - name: The measures, from fixtures
        run: python -m unittest tests.test_ops_agent_metrics -v
