name: voice-contract

on:
  pull_request:
    paths:
      - 'voice/index.html'
      - 'tests/voice.cjs'
      - 'tests/voice-browser*'
      - 'playwright.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/voice-tests.yml'
  push:
    branches: [main]
    paths:
      - 'voice/index.html'
      - 'tests/voice.cjs'
      - 'tests/voice-browser*'
      - 'playwright.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/voice-tests.yml'

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/voice.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify the rendered voice page and prove the regressions are caught
        run: node tests/voice-browser-negative-control.cjs
