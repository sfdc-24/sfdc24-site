name: ops-delivery-snap

on:
  schedule:
    # GitHub cron is UTC and cannot name America/New_York. These eight hours are
    # 9:00, 12:00, 15:00, and 18:00 in both Eastern Daylight (UTC-4: 13, 16, 19, 22)
    # and Eastern Standard (UTC-5: 14, 17, 20, 23). The window check below exits
    # without writing unless America/New_York is exactly one of those four hours
    # on a weekday, so the off-season hours do no work. No runs outside that window.
    # Friday 18:00 Eastern is still Friday in UTC, so day-of-week 1-5 matches.
    - cron: "0 13,14,16,17,19,20,22,23 * * 1-5"
  # A receipt merged into the seed reaches the page on that push, not only at the next slot.
  push:
    branches: [main]
    paths:
      - "data/ops-delivery.json"
      - "data/ops-delivery-policy.json"
      - "tools/ops_delivery*.py"
      - "tools/ops_agent_metrics.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-delivery-snap
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: site
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Project public evidence onto isolated snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if ! python site/tools/ops_delivery_window.py --check; then
              echo "Outside 9, 12, 15, and 18 America/New_York on a weekday. Nothing was written."
              exit 0
            fi
          fi
          # Ephemeral runner credentials, never embedded in remote URLs/logs.
          gh auth setup-git
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --heads "$remote" ops-delivery-snap > refs
          if test -s refs; then
            git clone --quiet --depth 1 --branch ops-delivery-snap "$remote" log
          else
            git init --quiet log
            git -C log checkout --quiet --orphan ops-delivery-snap
            mkdir -p log/data
            cp site/data/ops-delivery.json log/data/ops-delivery.json
          fi
          # This token is scoped to the site repository. Conference is private:
          # discovery does not query it. Metrics keep the file unchanged when a
          # public repository cannot be read, and omit conference when it cannot.
          python site/tools/ops_delivery_bake.py --previous log/data/ops-delivery.json --seed site/data/ops-delivery.json --policy site/data/ops-delivery-policy.json --repo sfdc-24/sfdc24-site --discover sfdc-24/sfdc24-site --discover sfdc-24/Blackboard --out log/data/ops-delivery.json
          python site/tools/ops_delivery.py --validate log/data/ops-delivery.json
          python site/tools/ops_agent_metrics.py --days 7 --out log/data/ops-agent-metrics.json
          git -C log config user.name sfdc24-ops-delivery
          git -C log config user.email ops-delivery@users.noreply.github.com
          git -C log add data/ops-delivery.json data/ops-agent-metrics.json
          if git -C log diff --cached --quiet; then
            echo "Refresh unchanged; no new commit."
            exit 0
          fi
          git -C log commit --quiet -m "ops-refresh: merged pull requests and agent metrics"
          git -C log push --quiet "$remote" HEAD:refs/heads/ops-delivery-snap
