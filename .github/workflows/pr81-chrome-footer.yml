name: pr81-chrome-footer
on:
  workflow_dispatch:
  push:
    branches: ["grok-bot/overnight-polish-check-footers"]
    paths:
      - ".github/workflows/pr81-chrome-footer.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-bot/overnight-polish-check-footers
      - name: Patch chrome.js ensureFooter to shared nav
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("assets/chrome.js")
          t = p.read_text(encoding="utf-8")
          old = """  function ensureFooter() {
    var links = [
      [\"/method/\", \"Method\"], [\"/panels/\", \"Panels\"],
      [\"/governor/\", \"Governor\"], [\"/intake/\", \"Intake\"], [\"/xray/\", \"X-ray\"],
      [\"/privacy/\", \"Privacy\"], [\"/terms/\", \"Terms\"],
      [\"mailto:abdus@sfdc24.com\", \"abdus@sfdc24.com\"]
    ];"""
          new = """  function ensureFooter() {
    /* Shared pattern: Method, Panels, Projects, Privacy, Terms + Governor/Intake/X-ray. */
    var links = [
      [\"/method/\", \"Method\"], [\"/panels/\", \"Panels\"], [\"/projects/\", \"Projects\"],
      [\"/privacy/\", \"Privacy\"], [\"/terms/\", \"Terms\"],
      [\"/governor/\", \"Governor\"], [\"/intake/\", \"Intake\"], [\"/xray/\", \"X-ray\"],
      [\"mailto:abdus@sfdc24.com\", \"abdus@sfdc24.com\"]
    ];"""
          if old not in t:
            if "/projects/" in t and "ensureFooter" in t:
              print("chrome already has projects in ensureFooter")
            else:
              raise SystemExit("ensureFooter pattern not found")
          else:
            t = t.replace(old, new, 1)
            p.write_text(t, encoding="utf-8")
            print("patched chrome.js", p.stat().st_size)
          PY
      - name: Commit if changed
        run: |
          git config user.name "sfdc-24"
          git config user.email "abdus@sfdc24.com"
          git add assets/chrome.js
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "overnight polish: chrome ensureFooter Projects + shared link order"
          git push
