name: sync-staging-ref

# Force-update refs/heads/staging to match the dispatch ref (default: main).
# Recipe equivalent: git push -f origin HEAD:staging

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to force onto staging (branch/SHA/tag)"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: sync-staging-ref
  cancel-in-progress: true

jobs:
  force-staging:
    name: sync-staging-ref / force-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          fetch-depth: 0

      - name: Force-push to staging
        run: |
          set -euo pipefail
          echo "Force-updating staging -> $(git rev-parse HEAD)"
          git push -f origin "HEAD:refs/heads/staging"
          echo "::notice::staging now at $(git rev-parse HEAD)"
