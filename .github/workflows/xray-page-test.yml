name: xray-page-test

# Kept separate from prototype-publisher-test rather than widening that job's
# discovery pattern, so the publisher's CI stays exactly as reviewed.

on:
  pull_request:
    paths:
      - "xray/**"
      - "sitemap.xml"
      - "tests/test_xray_page.py"
      - "tests/xray_render.cjs"
      - ".github/workflows/xray-page-test.yml"
  push:
    branches: [main]
    paths:
      - "xray/**"
      - "sitemap.xml"
      - "tests/test_xray_page.py"
      - "tests/xray_render.cjs"
      - ".github/workflows/xray-page-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Static: the sanitisers and the privacy/route contract are PRESENT.
      - run: python -m unittest discover -s tests -p "test_xray_page.py" -v
      # Behavioural: they WORK. Runs the served inline script against hostile
      # scores.json values under a DOM stub, per CODEX-XRAY-SAFETY-AMENDMENT-GO.
      - run: node --test tests/xray_render.cjs
