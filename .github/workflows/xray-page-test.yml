name: xray-page-test

# Kept separate from prototype-publisher-test rather than widening that job's
# discovery pattern, so the publisher's CI stays exactly as reviewed.

on:
  pull_request:
    paths:
      - "xray/**"
      # The suite asserts the robots directive on all four unlisted pages, so a
      # regression in any of them must run it. Without these three, the guard
      # that exists to stop the four drifting apart could not fire on three of
      # them. Found by chatgpt-codex-desktop on PR #13.
      - "governor/**"
      - "voice/**"
      - "404.html"
      - "sitemap.xml"
      - "tests/test_xray_page.py"
      - ".github/workflows/xray-page-test.yml"
  push:
    branches: [main]
    paths:
      - "xray/**"
      # The suite asserts the robots directive on all four unlisted pages, so a
      # regression in any of them must run it. Without these three, the guard
      # that exists to stop the four drifting apart could not fire on three of
      # them. Found by chatgpt-codex-desktop on PR #13.
      - "governor/**"
      - "voice/**"
      - "404.html"
      - "sitemap.xml"
      - "tests/test_xray_page.py"
      - ".github/workflows/xray-page-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p "test_xray_page.py" -v
