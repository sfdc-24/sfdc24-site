name: conference-page-test

# Owner join on /conference/. pull_request is path-filtered; this check is
# not part of ruleset 23679990.

on:
  pull_request:
    paths:
      - "conference/**"
      - "tests/test_conference_page.py"
      - "tests/conference_join.cjs"
      - "tests/conference_join.spec.cjs"
      - ".github/workflows/conference-page-test.yml"
  push:
    branches: [main]
    paths:
      - "conference/**"
      - "tests/test_conference_page.py"
      - "tests/conference_join.cjs"
      - "tests/conference_join.spec.cjs"
      - ".github/workflows/conference-page-test.yml"

permissions:
  contents: read

jobs:
  test:
    name: conference-page-test / test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_conference_page -v
      - run: node --test tests/conference_join.cjs
