name: site-csp

# Every page carries a Content-Security-Policy meta tag (tools/site_csp.py).
# The static check fails on a page with no tag, a tag that drifts from the
# tool, or an origin the page loads that its policy does not allow. The browser
# check loads every page and the flows that reach other origins, and fails on
# any violation Chromium reports. All third-party traffic is answered in the
# test; nothing reaches a live service.
# pull_request is always-on so the check can be required.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "data/*.json"
      - "tools/site_csp.py"
      - "tools/prototype_publisher.py"
      - "tests/test_site_csp.py"
      - "tests/csp_pages.spec.cjs"
      - ".github/workflows/site-csp.yml"

permissions:
  contents: read

jobs:
  csp:
    name: site-csp / every page has a policy that fits it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Static check (no browser)
        run: |
          python3 tools/site_csp.py --check
          python3 -m unittest tests.test_site_csp -v
      - name: Install from the lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Every page and flow loads with no CSP violation
        run: npx playwright test tests/csp_pages.spec.cjs --reporter=line
