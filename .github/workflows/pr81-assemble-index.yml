name: pr81-assemble-index
on:
  workflow_dispatch:
  push:
    branches: ["grok-bot/overnight-polish-check-footers"]
    paths:
      - ".github/workflows/pr81-assemble-index.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-bot/overnight-polish-check-footers
          fetch-depth: 0
      - name: Restore index.html from pre-break tip and humanize check note
        run: |
          set -euo pipefail
          curl -fsSL -o index.html \
            "https://raw.githubusercontent.com/sfdc-24/sfdc24-site/de06e54970cf2c6eb38a945361046c41004530b2/index.html"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          legacy = "checked — no claim about reading a live system"
          human = "Looks clear — nothing here claims to have read a live customer system"
          if legacy not in text and human not in text:
              raise SystemExit("unexpected index.html contents from restore source")
          text = text.replace(legacy, human)
          text = text.replace('cli("check — ', 'cli("looks clear — ')
          p.write_text(text, encoding="utf-8")
          print("restored+patched", p.stat().st_size)
          PY
          python3 tools/build_site_manifest.py
      - name: Commit restored index + matching site-manifest
        run: |
          git config user.name "sfdc-24"
          git config user.email "abdus@sfdc24.com"
          git add index.html data/site-manifest.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "overnight polish: restore index.html + humanize check note (site-manifest align)"
          git push
