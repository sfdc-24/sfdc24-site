name: pr81-assemble-index
on:
  push:
    branches: ["grok-bot/overnight-polish-check-footers"]
    paths:
      - "tools/_pr81_index_b64/**"
      - "tools/assemble_pr81_index.py"
      - ".github/workflows/pr81-assemble-index.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-bot/overnight-polish-check-footers
      - name: Assemble index.html from parts
        run: python3 tools/assemble_pr81_index.py
      - name: Commit restored index if changed
        run: |
          git config user.name "sfdc-24"
          git config user.email "abdus@sfdc24.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index unchanged"
            exit 0
          fi
          git commit -m "overnight polish: restore index.html (humanized check note) from parts"
          git push
