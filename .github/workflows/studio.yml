name: studio

# Item 6: the live studio at /studio/. The contract (studio/contract/) and its
# acceptance test (tests/studio.spec.cjs) come first; the page is built to them.
# pull_request is always-on so the check can be required.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "tests/studio.spec.cjs"
      - "tests/studio_contract.cjs"
      - "tests/studio_controller.spec.cjs"
      - ".github/workflows/studio.yml"

permissions:
  contents: read

jobs:
  studio:
    name: studio / contract and page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Contract holds (no browser)
        run: node --test tests/studio_contract.cjs
      - name: Install from the lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Page meets the contract
        run: npx playwright test tests/studio.spec.cjs --reporter=line
      - name: Controller transport
        run: npx playwright test tests/studio_controller.spec.cjs --reporter=line
