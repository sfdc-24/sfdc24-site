name: site-manifest

# Homepage-scoped manifest must stay in sync with tools/build_site_manifest.py.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/chrome.css"
      - "assets/chrome.js"
      - "assets/triage.py"
      - "assets/triage.js"
      - "data/site-manifest.json"
      - "tools/build_site_manifest.py"
      - "tools/site_edit_router.py"
      - ".github/workflows/site-manifest.yml"

permissions:
  contents: read

jobs:
  test:
    name: site-manifest / test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67ab7ff36d738cee13a4 # v5.4.0
        with:
          python-version: "3.12"
      - name: Regenerate manifest and fail on drift
        run: |
          cp data/site-manifest.json /tmp/site-manifest.committed.json
          python3 tools/build_site_manifest.py
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          def norm(d):
              d = dict(d)
              d.pop("built", None)
              return d
          fresh = norm(json.loads(Path("data/site-manifest.json").read_text(encoding="utf-8")))
          old = norm(json.loads(Path("/tmp/site-manifest.committed.json").read_text(encoding="utf-8")))
          if fresh != old:
              print("site-manifest drift detected — run tools/build_site_manifest.py and commit", file=sys.stderr)
              sys.exit(1)
          print("site-manifest OK (no drift)")
          PY
