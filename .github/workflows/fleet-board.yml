name: fleet-board

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/fleet-board.js"
      - "assets/fleet-board.css"
      - "data/fleet-public.json"
      - "tests/fleet_board.cjs"
      - "tests/fleet_board.spec.cjs"
      - ".github/workflows/fleet-board.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/fleet-board.js"
      - "assets/fleet-board.css"
      - "data/fleet-public.json"
      - "tests/fleet_board.cjs"
      - "tests/fleet_board.spec.cjs"
      - ".github/workflows/fleet-board.yml"

permissions:
  contents: read

jobs:
  test:
    name: fleet-board / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test tests/fleet_board.cjs tests/public_xp_snapshot.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/fleet_board.spec.cjs --reporter=line
