name: apply-okf-remainder
on:
  push:
    branches: [cursor/ops-okf-hub-3f73]
    paths:
      - .github/workflows/apply-okf-remainder.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply remaining OKF edits
        run: |
          set -euo pipefail
          cat .github/okf-parts/0.py .github/okf-parts/1.py .github/okf-parts/2.py .github/okf-parts/3.py .github/okf-parts/4.py .github/okf-parts/5.py > /tmp/apply_okf_remainder.py
          python3 /tmp/apply_okf_remainder.py
      - name: Commit applied files and drop this helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "sfdc24-board-ops"
          git config user.email "board-ops@users.noreply.github.com"
          git add assets tests tools
          git rm -rf .github/okf-parts .github/workflows/apply-okf-remainder.yml
          git commit -m "ops: finish OKF hub roles, styles, and tests"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:cursor/ops-okf-hub-3f73
