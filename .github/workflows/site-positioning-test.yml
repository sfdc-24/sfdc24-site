name: site-positioning-test

# Guards WHAT THE SITE CLAIMS, which nothing did before.
#
# On 2026-09-08 a commit titled "lead with capability" shipped the opposite and
# sat live for eleven hours. Every other check in this repo tests behaviour — a
# robots tag, retry semantics, synthetic-data labelling — and none of them would
# have noticed that the homepage had started selling a person.
#
# The path filter matches EVERY html surface, because the guard now checks every
# one of them. It used to list three pages, so a change to terms/ or projects/
# ran nothing at all - and those were two of the pages still selling a person.

on:
  pull_request:
    paths:
      - "**/*.html"
      - "site.webmanifest"
      - "sitemap.xml"
      # The share image and the script that generates it. og.png was the last
      # surface still selling the retired proposition, and no path filter
      # mentioned it, so changing it ran nothing.
      - "assets/og.png"
      - "assets/make_og.py"
      - "tests/site_positioning.cjs"
      - "tests/mutate_positioning.cjs"
      - ".github/workflows/site-positioning-test.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "site.webmanifest"
      - "sitemap.xml"
      # The share image and the script that generates it. og.png was the last
      # surface still selling the retired proposition, and no path filter
      # mentioned it, so changing it ran nothing.
      - "assets/og.png"
      - "assets/make_og.py"
      - "tests/site_positioning.cjs"
      - "tests/mutate_positioning.cjs"
      - ".github/workflows/site-positioning-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test tests/site_positioning.cjs
      # Green is not evidence. This reverts each fix in turn and requires the
      # suite to fail; it has already found one control that passed for the
      # wrong reason.
      - run: node tests/mutate_positioning.cjs
