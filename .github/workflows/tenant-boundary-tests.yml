name: tenant-boundary-tests

on:
  pull_request:
    paths:
      - "voice/index.html"
      - "tests/test_tenant_boundary_client.cjs"
      - ".github/workflows/tenant-boundary-tests.yml"

permissions:
  contents: read

jobs:
  signed-conversation-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/test_tenant_boundary_client.cjs
