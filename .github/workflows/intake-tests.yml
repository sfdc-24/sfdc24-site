name: intake-contract

# 2026-09-18 overnight: pull_request always-on so ruleset 23679990 can require
# intake-contract / intake on every PR. push:to main keeps path filters.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - intake/index.html
      - tests/intake.cjs
      - .github/workflows/intake-tests.yml

permissions:
  contents: read

jobs:
  intake:
    name: intake-contract / intake
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/intake.cjs
