name: site-data-refresh

# Disabled until the repository variable ENABLE_SITE_DATA_REFRESH is the
# string true. The schedule is registered so it can be turned on without a
# second code change. See docs/RELEASE-MILESTONES.md.
# No new secrets. GITHUB_TOKEN reads this repository and other public
# repositories. sfdc-24/conference is private and stays unavailable.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ vars.ENABLE_SITE_DATA_REFRESH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Refresh public aggregates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_site_data.py --commit
      - name: Push when the script committed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
