name: ops-forward

# The Ops delivery snapshot only moves forward (tools/ops_forward.py). The owner, 2026-09-30: "the
# ops page keeps going back in time". A pull request is checked against its base branch's file; a
# push to main (a direct commit) against the commit before it.

on:
  pull_request:
    paths:
      - "data/ops-delivery.json"
      - "tools/ops_forward.py"
      - "tests/test_ops_forward.py"
      - ".github/workflows/ops-forward.yml"
  push:
    branches: [main]
    paths:
      - "data/ops-delivery.json"
      - "tools/ops_forward.py"
      - "tests/test_ops_forward.py"
      - ".github/workflows/ops-forward.yml"

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: The rule's own tests
        run: python -m unittest tests.test_ops_forward -v
      - name: The delivery snapshot only moves forward
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --quiet --depth=1 origin "$BASE_REF"
            base=FETCH_HEAD
          else
            base=HEAD^
          fi
          if git cat-file -e "$base:data/ops-delivery.json" 2>/dev/null; then
            git show "$base:data/ops-delivery.json" > "$RUNNER_TEMP/base.json"
            python tools/ops_forward.py --base "$RUNNER_TEMP/base.json" --head data/ops-delivery.json
          else
            echo "No base snapshot to compare with."
          fi
