name: ops-agent-roster-test

on:
  pull_request:
    paths:
      - "ops/index.html"
      - "assets/ops-agent-roster.css"
      - "assets/board-ops*.js"
      - "tests/ops_agent_roster.cjs"
      - "tests/board_ops.cjs"
      - "tools/board_ops_snap.py"
      - "data/board-ops-snap.json"
      - ".github/workflows/ops-agent-roster-test.yml"
  push:
    branches: [main]
    paths:
      - "ops/index.html"
      - "assets/ops-agent-roster.css"
      - "assets/board-ops*.js"
      - "tests/ops_agent_roster.cjs"
      - "tests/board_ops.cjs"
      - "tools/board_ops_snap.py"
      - "data/board-ops-snap.json"
      - ".github/workflows/ops-agent-roster-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/ops_agent_roster.cjs tests/board_ops.cjs
