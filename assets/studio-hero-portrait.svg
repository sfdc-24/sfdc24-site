<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 516" width="360" height="516" role="img" aria-labelledby="t d">
  <title id="t">Four agents and a gatekeeper around one shared canvas</title>
  <desc id="d">Agent cards for Claude, Greg, Gemini and Cody, each with a voice wave, connected to a shared canvas that holds a logo, a data card and a three-step flow. Between the top cards and the canvas, a gatekeeper chip for Jev ranks the competing versions. A microphone chip marked Owner sits below.</desc>
  <!-- Phone layout of studio-hero.svg (same parts, stacked so the names stay readable). No product or company logos.
       Jev, the gatekeeper, has its own row under the top cards; everything below it sits 56px lower. -->
  <style>
    .wv rect{transform-box:fill-box;transform-origin:center;animation:wv 1.4s ease-in-out infinite}
    .wv rect:nth-child(2){animation-delay:-.2s}.wv rect:nth-child(3){animation-delay:-.5s}
    .wv rect:nth-child(4){animation-delay:-.8s}.wv rect:nth-child(5){animation-delay:-1.1s}
    .wv rect:nth-child(6){animation-delay:-.35s}.wv rect:nth-child(7){animation-delay:-.65s}
    @keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    .flow{stroke-dasharray:5 7;animation:fl 2.4s linear infinite}
    @keyframes fl{to{stroke-dashoffset:-24}}
    .live{animation:lv 2.8s ease-in-out infinite}
    @keyframes lv{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.wv rect,.flow,.live{animation:none}}
    .nm{font:700 15px "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;fill:#fff}
    .lb{font:500 10.5px "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;fill:#B9C6DA;letter-spacing:.04em}
    .cv{font:600 10px "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;fill:#4A5568;letter-spacing:.06em}
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1"/>
    </pattern>
  </defs>
  <ellipse cx="180" cy="248" rx="190" ry="228" fill="url(#glow)"/>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path class="flow" d="M92 78 V 160" stroke="#F4A261"/>
    <path class="flow" d="M268 78 V 160" stroke="#4FD1A5"/>
    <path class="flow" d="M180 134 V 160" stroke="#FFD166"/>
  </g>
  <!-- Jev, the gatekeeper: scores and ranks the competing versions -->
  <g>
    <rect x="108" y="88" width="144" height="46" rx="14" fill="url(#card)" stroke="#FFD166" stroke-opacity=".7"/>
    <path d="M128 99l9 3.3v6.5c0 5.8-4.1 9.4-9 11c-4.9-1.6-9-5.2-9-11v-6.5z" fill="#FFD166"/>
    <path d="M124 109l3 3l5.3-5.8" fill="none" stroke="#0d2a52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="nm" x="145" y="108">Jev</text>
    <text class="lb" x="145" y="125">GATEKEEPER</text>
    <g fill="#FFD166">
      <rect x="226" y="106" width="4" height="18" rx="2"/>
      <rect x="233" y="111" width="4" height="13" rx="2" opacity=".7"/>
      <rect x="240" y="116" width="4" height="8" rx="2" opacity=".45"/>
    </g>
  </g>
  <g transform="translate(0 56)">
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path class="flow" d="M92 318 V 340" stroke="#B197FC"/>
    <path class="flow" d="M268 318 V 340" stroke="#74B9FF"/>
    <path class="flow" d="M180 318 V 404" stroke="#FFFFFF" stroke-opacity=".7"/>
  </g>
  <g transform="translate(30 100) scale(1) translate(-170 -112)">
    <!-- the shared canvas -->
    <g filter="url(#sh)">
      <rect x="170" y="112" width="300" height="230" rx="18" fill="#F8FAFD"/>
    </g>
    <rect x="170" y="112" width="300" height="230" rx="18" fill="url(#dots)" opacity=".55"/>
    <path d="M170 130a18 18 0 0 1 18-18h264a18 18 0 0 1 18 18v12H170z" fill="#E8EEF7"/>
    <circle cx="188" cy="128" r="4" fill="#F4A261"/>
    <circle cx="201" cy="128" r="4" fill="#4FD1A5"/>
    <circle cx="214" cy="128" r="4" fill="#B197FC"/>
    <text class="cv" x="320" y="132" text-anchor="middle">SHARED CANVAS</text>
    <circle class="live" cx="452" cy="128" r="4" fill="#16A34A"/>
  
    <!-- a logo, drafted -->
    <rect x="188" y="158" width="92" height="92" rx="14" fill="#FFFFFF" stroke="#D5DEEA"/>
    <path d="M234 176 l22 13 v26 l-22 13 l-22 -13 v-26z" fill="url(#mark)"/>
    <path d="M234 190 l10 6 v12 l-10 6 l-10 -6 v-12z" fill="#FFFFFF" opacity=".9"/>
    <rect x="200" y="238" width="68" height="5" rx="2.5" fill="#CBD5E1"/>
  
    <!-- a data card, with a version chip: the same card, updated -->
    <rect x="294" y="158" width="158" height="92" rx="12" fill="#FFFFFF" stroke="#D5DEEA"/>
    <circle cx="314" cy="180" r="10" fill="#DBEAFE"/>
    <rect x="331" y="173" width="70" height="6" rx="3" fill="#334155"/>
    <rect x="331" y="184" width="46" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="306" y="202" width="134" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="306" y="214" width="112" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="306" y="226" width="124" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="412" y="166" width="32" height="18" rx="9" fill="#0A66C2"/>
    <text x="428" y="179" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">v3</text>
  
    <!-- a three-step guided flow -->
    <g>
      <rect x="188" y="266" width="264" height="58" rx="12" fill="#FFFFFF" stroke="#D5DEEA"/>
      <line x1="222" y1="295" x2="418" y2="295" stroke="#CBD5E1" stroke-width="3"/>
      <circle cx="222" cy="295" r="11" fill="#0A66C2"/>
      <circle cx="320" cy="295" r="11" fill="#0A66C2"/>
      <circle cx="418" cy="295" r="11" fill="#FFFFFF" stroke="#0A66C2" stroke-width="3"/>
      <path d="M217 295l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M315 295l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  
  </g>
  <g>
    <rect x="12" y="340" width="160" height="66" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".22"/>
    <circle cx="34" cy="362" r="9" fill="#B197FC"/>
    <text class="nm" x="50" y="367">Gemini</text>
    <text class="lb" x="28" y="391">VOICE</text>
    <g class="wv" fill="#B197FC"><rect x="74" y="378" width="5" height="16" rx="2.5"/><rect x="85" y="378" width="5" height="16" rx="2.5"/><rect x="96" y="378" width="5" height="16" rx="2.5"/><rect x="107" y="378" width="5" height="16" rx="2.5"/><rect x="118" y="378" width="5" height="16" rx="2.5"/><rect x="129" y="378" width="5" height="16" rx="2.5"/><rect x="140" y="378" width="5" height="16" rx="2.5"/><rect x="151" y="378" width="5" height="16" rx="2.5"/></g>
  </g>
  <g>
    <rect x="188" y="340" width="160" height="66" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".22"/>
    <circle cx="210" cy="362" r="9" fill="#74B9FF"/>
    <text class="nm" x="226" y="367">Cody</text>
    <text class="lb" x="204" y="391">VOICE</text>
    <g class="wv" fill="#74B9FF"><rect x="250" y="378" width="5" height="16" rx="2.5"/><rect x="261" y="378" width="5" height="16" rx="2.5"/><rect x="272" y="378" width="5" height="16" rx="2.5"/><rect x="283" y="378" width="5" height="16" rx="2.5"/><rect x="294" y="378" width="5" height="16" rx="2.5"/><rect x="305" y="378" width="5" height="16" rx="2.5"/><rect x="316" y="378" width="5" height="16" rx="2.5"/><rect x="327" y="378" width="5" height="16" rx="2.5"/></g>
  </g>
  <g>
    <rect x="94" y="410" width="172" height="44" rx="22" fill="#FFFFFF"/>
    <circle cx="118" cy="432" r="14" fill="#0A66C2"/>
    <path d="M118 438.5a4.5 4.5 0 0 0 4.5-4.5v-7a4.5 4.5 0 0 0-9 0v7a4.5 4.5 0 0 0 4.5 4.5z" fill="#fff"/>
    <path d="M111 433a7 7 0 0 0 14 0M118 440v3" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="140" y="437" font-family="Segoe UI,system-ui,sans-serif" font-size="14" font-weight="700" fill="#191919">Owner</text>
    <g class="wv" fill="#0A66C2"><rect x="196" y="425" width="4" height="15" rx="2"/><rect x="203" y="425" width="4" height="15" rx="2"/><rect x="210" y="425" width="4" height="15" rx="2"/><rect x="217" y="425" width="4" height="15" rx="2"/><rect x="224" y="425" width="4" height="15" rx="2"/></g>
  </g>
  </g>
  <g>
    <rect x="12" y="12" width="160" height="66" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".22"/>
    <circle cx="34" cy="34" r="9" fill="#F4A261"/>
    <text class="nm" x="50" y="39">Claude</text>
    <text class="lb" x="28" y="63">VOICE</text>
    <g class="wv" fill="#F4A261"><rect x="74" y="50" width="5" height="16" rx="2.5"/><rect x="85" y="50" width="5" height="16" rx="2.5"/><rect x="96" y="50" width="5" height="16" rx="2.5"/><rect x="107" y="50" width="5" height="16" rx="2.5"/><rect x="118" y="50" width="5" height="16" rx="2.5"/><rect x="129" y="50" width="5" height="16" rx="2.5"/><rect x="140" y="50" width="5" height="16" rx="2.5"/><rect x="151" y="50" width="5" height="16" rx="2.5"/></g>
  </g>
  <g>
    <rect x="188" y="12" width="160" height="66" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".22"/>
    <circle cx="210" cy="34" r="9" fill="#4FD1A5"/>
    <text class="nm" x="226" y="39">Greg</text>
    <text class="lb" x="204" y="63">VOICE</text>
    <g class="wv" fill="#4FD1A5"><rect x="250" y="50" width="5" height="16" rx="2.5"/><rect x="261" y="50" width="5" height="16" rx="2.5"/><rect x="272" y="50" width="5" height="16" rx="2.5"/><rect x="283" y="50" width="5" height="16" rx="2.5"/><rect x="294" y="50" width="5" height="16" rx="2.5"/><rect x="305" y="50" width="5" height="16" rx="2.5"/><rect x="316" y="50" width="5" height="16" rx="2.5"/><rect x="327" y="50" width="5" height="16" rx="2.5"/></g>
  </g>
</svg>
