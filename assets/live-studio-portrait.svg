<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 960" role="img" aria-labelledby="lsp-title lsp-desc">
<title id="lsp-title">Live voice studio: how a call with the agent team works</title>
<desc id="lsp-desc">You speak. The call runs in one of three modes. Brainstorm: every agent answers at once and their views fill one card in four sections. Workshop: Clay chairs and brings the right agent in. Demo: Greg drives the Salesforce screen while the others listen and take notes. A merge, deploy, send or delete is read back and waits for your spoken yes; Stop silences everyone. Every prompt, reply, card, estimate and outcome is logged on the audit board.</desc>
<style>
  .bg{fill:#11161d}.frame{fill:#161c25;stroke:#2b3442;stroke-width:1.5}
  .box{fill:#1b2330;stroke:#334055;stroke-width:1.2}
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#c9d3df}
  .mute{fill:#7d8a9b}.amber{fill:#f4a62a}.green{fill:#3fb68b}.blue{fill:#6fa8ff}
  .s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s19{font-size:19px}
  .b{font-weight:700}
  .line{stroke:#3a475b;stroke-width:1.4;fill:none}
  .on{stroke:#f4a62a}
  .p1,.p2,.p3{opacity:0;animation:cycle 15s infinite}
  .p2{animation-delay:5s}.p3{animation-delay:10s}
  @keyframes cycle{0%{opacity:0}3%{opacity:1}30%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
  .flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-28}}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .p1{opacity:1;animation:none}.p2,.p3{opacity:0;animation:none}
    .flow,.pulse{animation:none}
  }
</style>
<rect class="bg" width="420" height="960"/>
<rect class="frame" x="10" y="10" width="400" height="940" rx="12"/>
<circle cx="32" cy="34" r="6" fill="#ff5f57"/><circle cx="52" cy="34" r="6" fill="#febc2e"/><circle cx="72" cy="34" r="6" fill="#28c840"/>
<text class="t s15 b" x="92" y="39">SFDC24 // LIVE STUDIO</text>
<text class="t s13 mute" x="210" y="72" text-anchor="middle">PEOPLE LEAD. AGENTS HELP.</text>
<line class="line" x1="10" y1="86" x2="410" y2="86"/>

<rect class="box" x="125" y="104" width="170" height="40" rx="6" style="stroke:#f4a62a"/>
<text class="t s16 b amber" x="210" y="130" text-anchor="middle">YOU (voice)</text>
<path class="line on flow" d="M210 144 V164"/>

<rect class="box" x="26" y="164" width="368" height="40" rx="6"/>
<text class="t s14 mute" x="87" y="189" text-anchor="middle">Brainstorm</text>
<text class="t s14 mute" x="210" y="189" text-anchor="middle">Workshop</text>
<text class="t s14 mute" x="333" y="189" text-anchor="middle">Demo</text>
<line class="line" x1="149" y1="172" x2="149" y2="196"/><line class="line" x1="272" y1="172" x2="272" y2="196"/>
<g class="p1"><rect x="29" y="167" width="117" height="34" rx="5" fill="#2a2412" stroke="#f4a62a"/><text class="t s14 b amber" x="87" y="189" text-anchor="middle">Brainstorm</text></g>
<g class="p2"><rect x="152" y="167" width="117" height="34" rx="5" fill="#2a2412" stroke="#f4a62a"/><text class="t s14 b amber" x="210" y="189" text-anchor="middle">Workshop</text></g>
<g class="p3"><rect x="275" y="167" width="116" height="34" rx="5" fill="#2a2412" stroke="#f4a62a"/><text class="t s14 b amber" x="333" y="189" text-anchor="middle">Demo</text></g>

<rect class="box" x="26" y="216" width="368" height="64" rx="6" style="stroke:#5a4a1d"/>
<g class="p1"><text class="t s14" x="40" y="242">Every agent answers at once;</text><text class="t s14" x="40" y="264">one card, a section each.</text></g>
<g class="p2"><text class="t s14" x="40" y="242">Clay chairs: answers, or brings</text><text class="t s14" x="40" y="264">the right agent in for you.</text></g>
<g class="p3"><text class="t s14" x="40" y="242">Greg drives the Salesforce screen;</text><text class="t s14" x="40" y="264">the others listen, take notes.</text></g>

<path class="line" d="M210 280 V296 M113 296 H307 M113 296 V308 M307 296 V308"/>
<g class="p1"><path class="line on flow" d="M210 280 V296 M113 296 H307 M113 296 V308 M307 296 V308"/></g>
<g class="p2"><path class="line on flow" d="M210 280 V296 H113 V308"/></g>
<g class="p3"><path class="line on flow" d="M210 280 V296 H307 V308"/></g>

<g>
  <rect class="box" x="26" y="308" width="174" height="112" rx="8"/>
  <text class="t s19 b" x="113" y="338" text-anchor="middle">Clay</text>
  <text class="t s13 mute" x="113" y="360" text-anchor="middle">Build · Release</text>
  <text class="t s13 mute" x="113" y="376" text-anchor="middle">Coordinator</text>
  <rect class="box" x="220" y="308" width="174" height="112" rx="8"/>
  <text class="t s19 b" x="307" y="338" text-anchor="middle">Cody</text>
  <text class="t s13 mute" x="307" y="360" text-anchor="middle">Test · Review</text>
  <text class="t s13 mute" x="307" y="376" text-anchor="middle">every change</text>
  <rect class="box" x="26" y="436" width="174" height="112" rx="8"/>
  <text class="t s19 b" x="113" y="466" text-anchor="middle">Jemma</text>
  <text class="t s13 mute" x="113" y="488" text-anchor="middle">Architect</text>
  <text class="t s13 mute" x="113" y="504" text-anchor="middle">Governance</text>
  <rect class="box" x="220" y="436" width="174" height="112" rx="8"/>
  <text class="t s19 b" x="307" y="466" text-anchor="middle">Greg</text>
  <text class="t s13 mute" x="307" y="488" text-anchor="middle">Live demo</text>
  <text class="t s13 mute" x="307" y="504" text-anchor="middle">drives Salesforce</text>
</g>
<g class="t s13 b">
  <g class="p1">
    <text class="green pulse" x="113" y="404" text-anchor="middle">ANSWERING</text>
    <text class="green pulse" x="307" y="404" text-anchor="middle">ANSWERING</text>
    <text class="green pulse" x="113" y="532" text-anchor="middle">ANSWERING</text>
    <text class="green pulse" x="307" y="532" text-anchor="middle">ANSWERING</text>
  </g>
  <g class="p2">
    <text class="amber" x="113" y="404" text-anchor="middle">CHAIRING</text>
    <text class="green pulse" x="307" y="404" text-anchor="middle">BROUGHT IN</text>
    <text class="mute" x="113" y="532" text-anchor="middle">STANDBY</text>
    <text class="mute" x="307" y="532" text-anchor="middle">STANDBY</text>
  </g>
  <g class="p3">
    <text class="blue" x="113" y="404" text-anchor="middle">NOTES</text>
    <text class="blue" x="307" y="404" text-anchor="middle">NOTES</text>
    <text class="blue" x="113" y="532" text-anchor="middle">NOTES</text>
    <text class="green pulse" x="307" y="532" text-anchor="middle">PRESENTING</text>
  </g>
</g>

<path class="line" d="M210 548 V568"/>
<rect class="box" x="26" y="568" width="368" height="118" rx="8" style="stroke:#f4a62a"/>
<text class="t s15 b amber" x="210" y="596" text-anchor="middle">SPOKEN APPROVAL GATE</text>
<text class="t s13" x="40" y="622">A merge, deploy, send or delete</text>
<text class="t s13" x="40" y="640">is read back, then waits for “yes”.</text>
<text class="t s13 mute" x="40" y="662">“Stop” silences every agent.</text>
<text class="t s13 mute" x="40" y="678">Only tested, reviewed work ships.</text>
<path class="line" d="M210 686 V706"/>

<rect class="box" x="26" y="706" width="368" height="226" rx="8"/>
<text class="t s15 b" x="40" y="734">AUDIT BOARD</text>
<text class="t s13 mute" x="40" y="756">every prompt, reply, card,</text>
<text class="t s13 mute" x="40" y="772">estimate and outcome logged</text>
<line class="line" x1="26" y1="786" x2="394" y2="786"/>
<text class="t s14" x="40" y="814">Brainstorm</text><text class="t s13 mute" x="40" y="832">one card, four views</text>
<text class="t s14" x="40" y="862">Workshop</text><text class="t s13 mute" x="40" y="880">hand-off, change, review</text>
<text class="t s14" x="40" y="908">Demo</text><text class="t s13 mute" x="40" y="924">each step, a change log</text>
<g class="t s13 b">
  <text class="mute" x="380" y="814" text-anchor="end">waiting</text><text class="mute" x="380" y="862" text-anchor="end">waiting</text><text class="mute" x="380" y="908" text-anchor="end">waiting</text>
  <g class="p1"><rect x="300" y="800" width="86" height="20" fill="#1b2330"/><text class="green" x="380" y="814" text-anchor="end">LOGGED</text></g>
  <g class="p2"><rect x="300" y="848" width="86" height="20" fill="#1b2330"/><text class="green" x="380" y="862" text-anchor="end">LOGGED</text></g>
  <g class="p3"><rect x="300" y="894" width="86" height="20" fill="#1b2330"/><text class="green" x="380" y="908" text-anchor="end">LOGGED</text></g>
</g>
</svg>
