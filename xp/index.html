<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Owner view of the fleet: agents, instances, and the work moving between them.">
<title>Fleet</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/xp.css">
</head>
<body class="xp">
<header class="xp-bar">
  <a class="xp-mark" href="/">SFDC</a>
  <span class="xp-where">Fleet</span>
</header>
<main class="xp-main">
  <div id="xp-lock" hidden>
    <h1>Owner only</h1>
    <p><a href="/studio/?live=1">Sign in</a></p>
  </div>
  <div id="xp-app" hidden>
    <p class="xp-badge" id="xp-badge" data-xp-id="source-badge" data-xp-label="Source"></p>
    <p id="xp-stale" class="xp-empty" data-xp-id="stale-snapshot" hidden>stale snapshot</p>
    <div class="xp-stage" id="xp-stage">
      <svg class="xp-lines" id="xp-lines" aria-hidden="true"></svg>
      <button type="button" id="xp-sup" class="xp-sup" data-xp-kind="agent" data-xp-id="agent-pi1-cli" data-xp-label="pi1 supervisor"></button>
      <div class="xp-agents" id="xp-agents"></div>
    </div>
    <p class="xp-legend"><span data-xp-id="legend-watch" data-xp-label="Watch"><i class="is-watch"></i>Watch</span><span data-xp-id="legend-handoff" data-xp-label="Handoff"><i class="is-flow"></i>Handoff</span><span data-xp-id="legend-step" data-xp-label="Step"><i class="is-step"></i>Step</span></p>
    <section class="xp-block">
      <h2>Milestones</h2>
      <div class="xp-ms-row" id="xp-milestones"></div>
    </section>
    <section class="xp-block">
      <h2>Tasks</h2>
      <div class="xp-task-row" id="xp-tasks"></div>
    </section>
    <div class="xp-lower">
      <section class="xp-block" data-xp-id="feed-supervisor" data-xp-label="Supervisor feed">
        <h2>Supervisor</h2>
        <div class="xp-feed" id="xp-feed"></div>
      </section>
      <section class="xp-block">
        <h2>Output</h2>
        <button type="button" class="xp-metric" id="xp-metric" data-xp-id="metric-output-per-hour" data-xp-label="Output per hour" data-xp-open="metric-output-per-hour">
          <div id="xp-metric-body"></div>
        </button>
      </section>
    </div>
  </div>
  <dialog id="xp-detail" aria-labelledby="xp-detail-title">
    <button type="button" class="xp-close" data-xp-close>Close</button>
    <h2 id="xp-detail-title"></h2>
    <dl id="xp-detail-body"></dl>
  </dialog>
</main>
<footer class="chrome-foot">
  <nav aria-label="Footer">
    <span class="chrome-foot-main">
      <a href="/method/">Method</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
      <a href="/about/">About</a>
      <a href="/ops/">Ops</a>
      <a href="/conference/?room=workshop">Conferences</a>
    </span>
    <span class="chrome-foot-contact">
      <a href="https://www.linkedin.com/in/salams" class="chrome-linkedin" aria-label="LinkedIn" title="LinkedIn (opens in a new tab)" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96C2 21.32 2.69 22 3.55 22h16.9c.86 0 1.55-.68 1.55-1.52V3.52C22 2.68 21.31 2 20.45 2zM7.93 18.75H4.98V9.2h2.95v9.55zM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42zm12.3 10.85H15.8V14.1c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46v4.73H9.51V9.2h2.83v1.3h.04c.4-.76 1.36-1.56 2.79-1.56 2.99 0 3.58 1.97 3.58 4.53v5.28z"/></svg></a>
      <a href="mailto:abdus@sfdc24.com">abdus@sfdc24.com</a>
    </span>
  </nav>
</footer>
<script src="/assets/xp-adapter.js"></script>
<script src="/assets/xp-view.js"></script>
</body>
</html>
