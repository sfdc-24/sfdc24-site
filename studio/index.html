<!DOCTYPE html>
<html lang="en" data-palette="cobalt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — SFDC24</title>
<meta name="description" content="One conversation, one evolving prototype. Ask, point, change, confirm.">
<meta name="theme-color" content="#191919">
<link rel="stylesheet" href="/assets/chrome.css">
<link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
<header class="chrome-bar">
  <a class="mark chrome-mark" href="/">sfdc<span>24</span></a>
  <span class="where">Studio</span>
</header>
<div id="studio-app" data-controller-url="https://sfdc24-studio-controller-96522051727.us-central1.run.app">
  <div class="studio-shell">
    <section class="studio-stage" aria-label="Prototype">
      <p class="studio-kicker" id="studio-title"></p>
      <p class="studio-lede">Interactive build, integration and AI enablement. One conversation, one evolving prototype.</p>
      <p class="studio-demo" data-studio-demo hidden>A scripted walkthrough of how a session works: pick an option and watch the prototype change. <button type="button" class="studio-demo-restart" data-action="restart">Start again</button> <a class="studio-demo-live" data-studio-live href="/studio/?live=1" hidden>Sign in for a live session</a></p>
      <p class="studio-note" data-studio-note role="status" hidden></p>
      <p id="studio-status" data-studio-status hidden></p>
      <button type="button" class="studio-command-retry" data-studio-command-retry hidden>Retry last action</button>
      <div class="studio-voice" data-studio-voice hidden>
        <button type="button" class="studio-talk" data-studio-talk data-action="talk" hidden>Talk</button>
        <button type="button" class="studio-talk" data-studio-stop data-action="stop" hidden>Stop</button>
        <p data-studio-voice-status role="status" hidden></p>
        <p data-studio-caption hidden></p>
      </div>
      <audio data-studio-voice-audio autoplay></audio>
      <p data-studio-confirm></p>
      <div id="studio-artifact" data-artifact-version="0"></div>
      <p id="studio-progress" hidden></p>
    </section>
    <aside class="studio-side" aria-label="Decisions">
      <div class="studio-finish" data-studio-finish hidden>
        <p data-studio-finish-text></p>
        <p class="studio-finish-actions"><a class="studio-finish-next" href="/intake/">Tell us what you want built</a>
          <button type="button" class="studio-demo-restart" data-action="restart">Start again</button></p>
      </div>
      <div id="studio-active"></div>
      <div id="studio-batch"></div>
      <div id="studio-history"></div>
    </aside>
  </div>
</div>
<div id="studio-live" aria-live="polite"></div>
<script src="/studio/studio.js"></script>
</body>
</html>
