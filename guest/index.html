<!DOCTYPE html>

<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://conference-guest-96522051727.us-central1.run.app wss://*.livekit.cloud https://*.livekit.cloud; object-src 'none'; base-uri 'self'; form-action 'self'">

<meta name="robots" content="noindex">
<title>Guest call</title>
<meta name="description" content="An invited guest seat. Talk, listen, and see the shared screen.">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/chrome.css">
<link rel="stylesheet" href="/assets/guest-room.css">
</head>
<body class="sitefoot" data-chrome-section="Guest" data-chrome-ask="off">
<header class="masthead chrome-bar">
  <a class="mark chrome-mark" href="/" data-live-brand="1" title="America/Toronto">SFDC</a>
  <span class="where">Guest</span>
</header>
<main class="guest-app" id="guest">
  <p class="guest-offer" id="guest-offer">Assessment, automation, and AI enablement.</p>
  <p class="guest-role" id="guest-role" hidden>An invited guest can talk, listen, and see the shared screen. The guest does not run the meeting.</p>
  <p id="guest-status" role="status" hidden>Checking the invite.</p>
  <form id="guest-enter" class="guest-enter" method="post" action="/guest/" autocomplete="off">
    <label for="guest-code">Enter your code</label>
    <div class="guest-enter-row">
      <input id="guest-code" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="join">
      <button type="submit">Join</button>
    </div>
  </form>
  <section id="guest-stage" hidden>
    <div id="guest-screen" aria-label="Shared screen">
      <div id="guest-screen-videos"></div>
      <p id="guest-screen-empty">Waiting for the shared screen.</p>
    </div>
    <div id="guest-people" role="list" aria-label="People in the call"></div>
  </section>
  <div class="guest-controls">
    <button type="button" id="guest-mute" hidden>Mute</button>
    <button type="button" id="guest-leave" hidden>Leave</button>
  </div>
  <div id="guest-audio" class="guest-audio"></div>
</main>
<script>
(function () {
  var raw = "";
  try { raw = String(location.hash || ""); } catch (err) { raw = ""; }
  if (raw.charAt(0) === "#") raw = raw.slice(1);
  var enter = document.getElementById("guest-enter");
  var offer = document.getElementById("guest-offer");
  var role = document.getElementById("guest-role");
  var status = document.getElementById("guest-status");
  if (!raw || !raw.replace(/\s+/g, "")) {
    if (offer) offer.hidden = true;
    return;
  }
  if (enter) enter.hidden = true;
  if (offer) offer.hidden = false;
  if (role) role.hidden = false;
  if (status) status.hidden = false;
})();
</script>
