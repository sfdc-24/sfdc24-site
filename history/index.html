<!DOCTYPE html>
<html lang="en" data-palette="cobalt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History</title>
<meta name="description" content="Storybook timeline of this interactive build and AI enablement site since 4 Sep 2026 — 24 hour clock, America/Toronto.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/chrome.css">
<style>
:root{
  --ink:#191919; --paper:#FFFFFF; --mute:#666666; --accent:#0A66C2; --soft:#F3F2EF;
  --body:#666666; --rule:color-mix(in srgb, var(--ink) 14%, var(--paper)); --signal:var(--mute);
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--body);font-family:var(--ui);font-size:17px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:0 24px 48px}
h1{font-family:var(--display);font-weight:600;color:var(--ink);font-size:clamp(26px,3vw,36px);margin:26px 0 8px}
.lede{max-width:62ch;margin:0 0 8px}
.origin{font:500 11px/1.45 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  border-left:2px solid var(--rule);padding:6px 0 6px 10px;margin:14px 0 22px;max-width:70ch}
.hist-meta{font:600 12px/1.4 ui-monospace,Menlo,monospace;color:#666666;margin:0 0 16px}
.hist-day{position:relative;padding:0 0 18px 18px;border-left:2px solid var(--rule)}
.hist-day h2{margin:0 0 8px;font:700 13px/1.3 system-ui,sans-serif;color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.hist-row{display:grid;grid-template-columns:52px 64px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:6px 0;text-decoration:none;color:var(--body);border-bottom:1px solid #F3F2EF}
.hist-row:hover,.hist-row:focus-visible{background:#fff;color:var(--ink)}
.hist-time{font:600 12px/1.2 ui-monospace,Menlo,monospace;color:var(--mute);font-variant-numeric:tabular-nums}
.hist-row code{font:600 11px/1.2 ui-monospace,Menlo,monospace;color:var(--mute)}
.hist-sub{font-size:14.5px;min-width:0}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--mute)}
footer a{color:var(--accent);text-decoration:none;margin-right:14px}
</style>
</head>
<body class="sitefoot" data-chrome-section="History">
<div class="wrap">
  <header class="masthead">
    <span class="where">History</span>
  </header>
  <h1>History</h1>
  <p class="lede">Visual storybook of this interactive build and AI enablement site, from the git log since 4 Sep 2026. Estimate versus execution, not blame — Skateboarder Mode.</p>
  <p class="origin">America/Toronto · 24h clock · started 4 Sep 2026</p>
  <div id="history-mount">Loading timeline…</div>
  <footer class="chrome-foot">
    <nav>
      <a href="/">Board</a>
      <a href="/method/">Method</a>
      <a href="/history/">History</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </footer>
</div>
<script src="/assets/history-timeline.js" defer></script>
<script src="/assets/chrome.js" defer></script>
</body>
</html>
