  <text x="32" y="100" fill="#191919" font-family="Spectral, Georgia, serif" font-size="32">Tables</text>
  <text x="32" y="128" fill="#666666" font-family="Public Sans, Segoe UI, sans-serif" font-size="15">Key schema. Not a live key count. Assessment, automation, and AI enablement.</text>
