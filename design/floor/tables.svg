  <text x="48" y="186" fill="#0A66C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v1:bus:row:{Row_ID}</text>
  <text x="520" y="186" fill="#191919" font-family="Public Sans, Segoe UI, sans-serif" font-size="14">hash</text>
  <text x="48" y="210" fill="#666666" font-family="Public Sans, Segoe UI, sans-serif" font-size="13">Mirrored sheet row. Values stay off the page.</text>
  <rect x="32" y="240" width="1376" height="72" fill="#FFFFFF" stroke="#D9D6D1"/>
  <text x="48" y="270" fill="#0A66C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v1:bus:rowids</text>
  <text x="520" y="270" fill="#191919" font-family="Public Sans, Segoe UI, sans-serif" font-size="14">set</text>
  <text x="48" y="294" fill="#666666" font-family="Public Sans, Segoe UI, sans-serif" font-size="13">Mirrored row ids.</text>
  <rect x="32" y="324" width="1376" height="72" fill="#FFFFFF" stroke="#D9D6D1"/>
  <text x="48" y="354" fill="#0A66C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v1:bus:compare</text>
  <text x="520" y="354" fill="#191919" font-family="Public Sans, Segoe UI, sans-serif" font-size="14">stream</text>
  <text x="48" y="378" fill="#666666" font-family="Public Sans, Segoe UI, sans-serif" font-size="13">Verdict and counts. Counts hidden while the gate is held.</text>
  <rect x="32" y="408" width="1376" height="72" fill="#FFFFFF" stroke="#D9D6D1"/>
  <text x="48" y="438" fill="#0A66C2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">v1:agent:{id}</text>
  <text x="520" y="438" fill="#191919" font-family="Public Sans, Segoe UI, sans-serif" font-size="14">hash</text>
  <text x="48" y="462" fill="#666666" font-family="Public Sans, Segoe UI, sans-serif" font-size="13">Roster copy. The file is the original.</text>
