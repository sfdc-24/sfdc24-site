<meta name="referrer" content="no-referrer">
<!-- Unlisted on purpose: noindex, and this path is not listed in sitemap.xml. -->
<meta name="robots" content="noindex">
<title>Share this screen</title>
<meta name="description" content="Share a screen into a call. This page sends only its screen.">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/icon-32.png" sizes="32x32">

<body class="sitefoot" data-chrome-section="Share" data-chrome-ask="off">
<header class="masthead chrome-bar">
  <a class="mark chrome-mark" href="/" data-live-brand="1" title="America/Toronto">SFDC</a>
  <span class="where">Share</span>
</header>
<main class="present-app wrap" id="present">
  <h1>Share this screen</h1>
  <p class="present-offer">Assessment, automation, and AI enablement.</p>
  <p class="present-note">This page sends only its screen: no microphone, no sound, and it hears nothing.</p>
  <p id="present-status" class="present-status" role="status">Ready to share.</p>
  <form id="present-enter" class="present-enter" method="post" action="/present/" autocomplete="off">
    <label for="present-code">Enter your code</label>
    <input id="present-code" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
  </form>
  <div class="present-controls">
    <button type="button" id="present-share">Share this screen</button>
    <button type="button" id="present-stop" hidden>Stop</button>
  </div>
  <p id="present-on-air" class="present-banner" hidden>SHARING TO THE CONFERENCE</p>
</main>
<script>
(function () {
  // Same decoded trimmed fragment as hashCode() in assets/present-room.js.
  var raw = "";
  try { raw = String(location.hash || ""); } catch (err) { return; }
  if (raw.charAt(0) === "#") raw = raw.slice(1);
  try { raw = decodeURIComponent(raw.replace(/\+/g, "%2B")); } catch (err) {}
  if (!String(raw).trim()) return;
  var enter = document.getElementById("present-enter");
  if (enter) enter.hidden = true;
})();
</script>
